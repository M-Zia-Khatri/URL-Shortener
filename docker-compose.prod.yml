services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: runtime
    command: ["node", "dist/server.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      PORT: ${PORT:?PORT is required}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:?CACHE_TTL_SECONDS is required}
      NEGATIVE_CACHE_TTL_SECONDS: ${NEGATIVE_CACHE_TTL_SECONDS:?NEGATIVE_CACHE_TTL_SECONDS is required}
      BLOCK_PRIVATE_URLS: ${BLOCK_PRIVATE_URLS:?BLOCK_PRIVATE_URLS is required}
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY is required}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:?RATE_LIMIT_WINDOW_SECONDS is required}
      RATE_LIMIT_CREATE: ${RATE_LIMIT_CREATE:?RATE_LIMIT_CREATE is required}
      RATE_LIMIT_MANAGEMENT: ${RATE_LIMIT_MANAGEMENT:?RATE_LIMIT_MANAGEMENT is required}
      RATE_LIMIT_REDIRECT: ${RATE_LIMIT_REDIRECT:?RATE_LIMIT_REDIRECT is required}
      RATE_LIMIT_ANALYTICS: ${RATE_LIMIT_ANALYTICS:?RATE_LIMIT_ANALYTICS is required}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
      target: runtime
    command: ["node", "dist/workers/analytics.worker.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL is required}
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: url-shortener-production
    driver: bridge

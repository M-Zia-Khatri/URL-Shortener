services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Installs the entire workspace once; runtime services only consume its volumes.
  installer:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack pnpm install"
    environment:
      CI: "true"
    volumes:
      - .:/app
      - workspace_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
      # Add these lines to isolate container node_modules from host leaks:
      - /app/node_modules
      - /app/client/node_modules
      - /app/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack pnpm --filter server dev"
    volumes:
      - .:/app
      - workspace_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
    environment:
      DATABASE_URL: postgres://urlshortener:urlshortener@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
      PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      installer:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack pnpm --filter server worker"
    volumes:
      - .:/app
      - workspace_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
    environment:
      DATABASE_URL: postgres://urlshortener:urlshortener@postgres:5432/urlshortener
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
      PUBLIC_BASE_URL: http://localhost:3000
    depends_on:
      installer:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && corepack pnpm --filter client dev --host 0.0.0.0"
    volumes:
      - .:/app
      - workspace_node_modules:/app/node_modules
      - client_node_modules:/app/client/node_modules
      - server_node_modules:/app/server/node_modules
    ports:
      - "5173:5173"
    depends_on:
      installer:
        condition: service_completed_successfully
      server:
        condition: service_started

volumes:
  workspace_node_modules:
  client_node_modules:
  server_node_modules:

networks:
  default:
    # An explicit, stable bridge network avoids Compose reusing a stale implicit network ID after `down`.
    name: url-shortener-development
    driver: bridge
